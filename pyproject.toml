[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "nomad_build_backend"
backend-path = ["."]

[project]
name = "codex-nomad-surface"
version = "0.1.0"
description = "A small Streamlit app for remotely operating a host-side Codex App Server from a mobile browser."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "streamlit==1.59.2",
    "starlette>=0.40.0",
    "websockets>=15.0",
]

[[tool.streamlit.component.components]]
name = "nomad_canvas"
asset_dir = "ui_components/generated/nomad_canvas"

[[tool.streamlit.component.components]]
name = "nomad_text"
asset_dir = "ui_components/generated/nomad_text"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "jsonschema>=4.0",
    "pytest>=8.0",
]
test = [
    "jsonschema>=4.0",
    "pytest>=8.0",
]

[tool.setuptools]
include-package-data = false
packages = [
    "codex_nomad_surface",
    "codex_nomad_surface.ui_components",
]

[tool.setuptools.package-data]
"codex_nomad_surface.ui_components" = ["assets/*.js", "assets/*.css", "assets/*.svg"]
"codex_nomad_surface" = ["pyproject.toml", "ui_components/generated/**/*"]

[tool.ruff]
target-version = "py312"
