name: Build Python wheel

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: |
            components/nomad-canvas/nomad_canvas/frontend/package-lock.json
            components/nomad-text/nomad_text/frontend/package-lock.json

      - name: Prepare build environment
        run: python scripts/dev.py setup

      - name: Build and verify distributions
        run: python scripts/dev.py build-package

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: codex-nomad-surface-wheel-${{ github.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
